[project]
name = "offliner"
version = "0.1.0"
description = "Self-hosted MusicBrainz-tagged offline music downloader"
authors = [
    { name = "Stefano Dottore", email = "stefano.dottore@zuru.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.142.2",
    "httpx>=0.28.1",
    "mutagen>=1.48.1",
    "rapidfuzz>=3.14.6",
    "sqlmodel>=0.0.47",
    "uvicorn[standard]>=0.54.0",
    "yt-dlp[default]>=2026.8.19",
    "ytmusicapi>=1.12.3",
]

[project.scripts]
offliner = "offliner:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = ["network: tests that hit real external services (deselect with -m 'not network')"]
addopts = "-m 'not network'"
