services:
  offliner:
    build: .
    image: offliner:latest
    container_name: offliner
    ports:
      - "8080:8080"
    environment:
      # Contact info sent in the MusicBrainz/LRCLIB User-Agent (recommended by MusicBrainz)
      OFFLINER_CONTACT: ${OFFLINER_CONTACT:-}
      TZ: ${TZ:-UTC}
    volumes:
      - ./data:/data
      - ${MUSIC_DIR:-./music}:/music
    restart: unless-stopped
